<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/img/favicon1.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitForge | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at top left, rgba(182, 255, 0, 0.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(0, 255, 170, 0.08), transparent 30%),
                #0b0d0c;

            color: #fff;

            /* Allow scrolling when content is taller than the screen */
            overflow-x: hidden;
            overflow-y: auto;

            padding: 30px 0;
        }

        /* Background decoration */
        body::before {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            border: 1px solid rgba(174, 255, 0, 0.08);
            border-radius: 50%;
            top: -180px;
            right: -150px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border: 1px solid rgba(174, 255, 0, 0.06);
            border-radius: 50%;
            bottom: -160px;
            left: -120px;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 420px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            background: rgba(20, 23, 21, 0.88);
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #b6ff00;
            color: #0b0d0c;
            font-size: 21px;
            font-weight: 900;
            transform: rotate(-5deg);
        }

        .logo span {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span strong {
            color: #b6ff00;
        }

        .heading {
            margin-bottom: 28px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .heading p {
            color: #858a86;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #bfc3bf;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777c78;
            font-size: 16px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 15px 14px 43px;
            border: 1px solid #292d2a;
            border-radius: 12px;
            outline: none;
            background: #111412;
            color: #fff;
            font-size: 14px;
            transition: 0.25s ease;
        }

        .input-wrapper input::placeholder {
            color: #555a56;
        }

        .input-wrapper input:focus {
            border-color: #b6ff00;
            box-shadow: 0 0 0 3px rgba(182, 255, 0, 0.08);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0 24px;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #858a86;
        }

        .remember input {
            accent-color: #b6ff00;
        }

        .forgot {
            color: #b6ff00;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #b6ff00;
            color: #0b0d0c;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            background: #c4ff32;
            box-shadow: 0 10px 25px rgba(182, 255, 0, 0.18);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #555a56;
            font-size: 11px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #292d2a;
        }

        .social-login {
            display: flex;
            gap: 10px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #292d2a;
            border-radius: 11px;
            background: #111412;
            color: #ddd;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .social-btn:hover {
            background: #181c19;
            border-color: #3b403c;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            color: #777c78;
            font-size: 13px;
        }

        .signup a {
            color: #b6ff00;
            text-decoration: none;
            font-weight: 700;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .quote {
            text-align: center;
            margin-top: 22px;
            font-size: 11px;
            color: #4f544f;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 24px;
            }

            .heading h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <div class="logo-icon">F</div>
            <span>FIT<strong>FORGE</strong></span>
        </div>

        <div class="heading">
            <h1>Welcome back.</h1>
            <p>Ready to get stronger? Log in and let's train.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="input-group">
                <label for="email">Username</label>

                <div class="input-wrapper">
                    <!-- <span>👤</span> -->
                    <span>🗿</span>
                    <!-- <span>🏋</span> -->
                    <input type="text" id="email" name="Username" placeholder="Username" required />
                </div>
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="input-wrapper">
                    <span>🔒</span>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required />
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" />
                    Remember me
                </label>

                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">
                LOGIN &nbsp;
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="/signup/">Create one</a>
            <br>
            Skip Loginx?
            <a href="/index/">Home</a>
        </div>

        <div class="quote">
            Train hard. Stay consistent.
        </div>

    </div>

</body>

</html>
