<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/static/img/favicon1.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitForge | Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at top left, rgba(182, 255, 0, 0.12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(0, 255, 170, 0.08), transparent 30%),
                #0b0d0c;

            color: #fff;

            /* Allow scrolling when content is taller than the screen */
            overflow-x: hidden;
            overflow-y: auto;

            padding: 30px 0;
        }

        body::before {
            content: "";
            position: absolute;
            width: 450px;
            height: 450px;
            border: 1px solid rgba(182, 255, 0, 0.08);
            border-radius: 50%;
            top: -180px;
            right: -150px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 350px;
            height: 350px;
            border: 1px solid rgba(182, 255, 0, 0.06);
            border-radius: 50%;
            bottom: -160px;
            left: -120px;
        }

        .signup-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 440px;
            padding: 36px 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            background: rgba(20, 23, 21, 0.88);
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        }

        /* Logo */

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: #b6ff00;
            color: #0b0d0c;
            font-size: 21px;
            font-weight: 900;
            transform: rotate(-5deg);
        }

        .logo span {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span strong {
            color: #b6ff00;
        }

        /* Heading */

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 31px;
            margin-bottom: 7px;
            letter-spacing: -1px;
        }

        .heading p {
            color: #858a86;
            font-size: 14px;
        }

        /* Inputs */

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #bfc3bf;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper span {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777c78;
            font-size: 15px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 13px 15px 13px 43px;
            border: 1px solid #292d2a;
            border-radius: 12px;
            outline: none;
            background: #111412;
            color: #fff;
            font-size: 14px;
            transition: 0.25s ease;
        }

        .input-wrapper input::placeholder {
            color: #555a56;
        }

        .input-wrapper input:focus {
            border-color: #b6ff00;
            box-shadow: 0 0 0 3px rgba(182, 255, 0, 0.08);
        }

        /* Terms */

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin: 18px 0 20px;
            color: #777c78;
            font-size: 11px;
            line-height: 1.5;
        }

        .terms input {
            margin-top: 2px;
            accent-color: #b6ff00;
        }

        .terms a {
            color: #b6ff00;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        /* Button */

        .signup-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #b6ff00;
            color: #0b0d0c;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            background: #c4ff32;
            box-shadow: 0 10px 25px rgba(182, 255, 0, 0.18);
        }

        /* Login */

        .login {
            text-align: center;
            margin-top: 22px;
            color: #777c78;
            font-size: 13px;
        }

        .login a {
            color: #b6ff00;
            text-decoration: none;
            font-weight: 700;
        }

        .login a:hover {
            text-decoration: underline;
        }

        .quote {
            text-align: center;
            margin-top: 18px;
            font-size: 10px;
            color: #4f544f;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 30px 24px;
            }

            .heading h1 {
                font-size: 28px;
            }
        }

        .profile-upload {
            width: 100%;
        }

        .upload-box {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            min-height: 82px;
            padding: 12px 14px;
            border: 1px dashed #353a36;
            border-radius: 15px;
            background: linear-gradient(145deg, #141815, #101311);
            cursor: pointer;
            transition: all 0.25s ease;
            overflow: hidden;
        }

        .upload-box::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at left, rgba(182, 255, 0, 0.08), transparent 45%);
            opacity: 0;
            transition: 0.25s ease;
        }

        .upload-box:hover {
            border-color: rgba(182, 255, 0, 0.65);
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(182, 255, 0, 0.06);
        }

        .upload-box:hover::before {
            opacity: 1;
        }

        /* Image preview circle */
        .upload-preview {
            position: relative;
            z-index: 1;
            width: 56px;
            height: 56px;
            min-width: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid #2d322f;
            background: #0b0d0c;
            overflow: hidden;
        }

        .upload-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-emoji {
            font-size: 25px;
        }

        /* Text */
        .upload-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .upload-content strong {
            color: #e8ebe8;
            font-size: 13px;
            font-weight: 700;
        }

        .upload-content small {
            color: #666c67;
            font-size: 10px;
        }

        /* Plus button */
        .upload-icon {
            position: relative;
            z-index: 1;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            background: #b6ff00;
            color: #0b0d0c;
            font-size: 21px;
            font-weight: 800;
            transition: 0.25s ease;
        }

        .upload-box:hover .upload-icon {
            transform: rotate(90deg);
        }

        /* Mobile */
        @media (max-width: 480px) {
            .upload-box {
                min-height: 76px;
                padding: 10px 12px;
            }

            .upload-preview {
                width: 50px;
                height: 50px;
                min-width: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <!-- Logo -->
        <div class="logo">
            <div class="logo-icon">F</div>
            <span>FIT<strong>FORGE</strong></span>
        </div>

        <!-- Heading -->
        <div class="heading">
            <h1>Join the grind.</h1>
            <p>Create your account and start your fitness journey.</p>
        </div>

        <!-- Sign Up Form -->
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <!-- Username -->
            <div class="input-group">
                <label for="username">Username</label>

                <div class="input-wrapper">
                    <span>👤</span>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required />
                </div>
            </div>

            <!-- Phone -->
            <div class="input-group">
                <label for="phone">Phone number</label>

                <div class="input-wrapper">
                    <span>📱</span>
                    <input type="tel" id="phone" name="phone" placeholder="Phone number" required />
                </div>
            </div>

            <!-- Email -->
            <div class="input-group">
                <label for="email">Email address</label>

                <div class="input-wrapper">
                    <span>✉</span>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required />
                </div>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label for="password">Password</label>

                <div class="input-wrapper">
                    <span>🔒</span>
                    <input type="password" id="password" name="pswd" placeholder="Create a strong password" required />
                </div>
            </div>


            <!-- Profile Image -->
            <div class="input-group"> <label for="profile-image">Profile photo</label>
                <div class="profile-upload">
                    <input type="file" id="profile-image" name="profile_image" accept="image/*" hidden required />
                    <label for="profile-image" class="upload-box">
                        <div class="upload-preview" id="uploadPreview">
                            <span class="upload-emoji">📸</span>
                        </div>
                        <div class="upload-content">
                            <strong>Upload your photo</strong>
                            <small>JPG, PNG or WEBP • Max 5MB</small>
                        </div>
                        <div class="upload-icon">＋</div>
                    </label>
                </div>
            </div>

            <!-- Terms -->
            <label class="terms">
                <input type="checkbox" required />

                <span>
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </span>
            </label>

            <!-- Button -->
            <button type="submit" class="signup-btn">
                CREATE ACCOUNT &nbsp;
            </button>

        </form>

        <!-- Login -->
        <div class="login">
            Already have an account?
            <a href="/login/">Log in</a>
            <br>
            Avoid Sign-up?
            <a href="/index/">Home</a>
        </div>

        <div class="quote">
            Train hard. Stay consistent.
        </div>

    </div>
    <script>
        const profileImage = document.getElementById("profile-image");
        const uploadPreview = document.getElementById("uploadPreview");
        profileImage.addEventListener("change", function () {
            const file = this.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                alert("Please choose an image smaller than 5MB.");
                this.value = ""; return;
            }
            const reader = new FileReader();
            reader.onload = function (e) {
                uploadPreview.innerHTML = ` <img src="${e.target.result}" 
                alt="Profile preview"> `;
            };
            reader.readAsDataURL(file);
        }); </script>
</body>

</html>
